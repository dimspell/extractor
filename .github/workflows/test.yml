name: Test
on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: stable
  RUST_BACKTRACE: 1

jobs:
  compile:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          persist-credentials: false

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        id: cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./target/
          key: test-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}-compile
          restore-keys: |
            test-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}-compile

      - name: Check formatting
        run: bash scripts/ci-commands.sh fmt-check

      - name: Verify forked-iced pin/back-end consistency
        run: bash scripts/ci-commands.sh check-iced-config

      - name: Verify project metadata consistency
        run: bash scripts/ci-commands.sh check-metadata

      - name: Test the metadata validator
        run: bash scripts/ci-commands.sh check-metadata-test

      - name: Run Clippy
        run: bash scripts/ci-commands.sh clippy

      - name: Run full test suite
        run: bash scripts/ci-commands.sh test

      - name: Build project
        run: bash scripts/ci-commands.sh build
