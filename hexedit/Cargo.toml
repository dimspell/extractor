[package]
name = "hexedit"
version = "0.9.2"
edition = "2024"

[[bin]]
name = "hexedit"
path = "src/main.rs"

[dependencies]
iced = { workspace = true, default-features = false, features = ["advanced", "tokio", "wgpu", "canvas", "lazy"] }
gui-widgets = { path = "../gui-widgets", features = ["accessibility"] }
lru = "0.12"
tokio = { version = "1", features = ["fs", "rt"] }
once_cell = "1"
rfd = "0.16"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
lucide-icons = "1.23.0"

[features]
default = ["lua"]
lua = ["dep:mlua"]

[dependencies.mlua]
version = "0.11.6"
optional = true
default-features = false
features = ["lua54", "send", "vendored"]

[dev-dependencies]
iced_test = { workspace = true }
# `iced_test` selects its renderer through Cargo feature unification. Enable
# the software renderer so UI simulations run without a GPU or window server.
iced_renderer = { git = "https://github.com/dimspell/iced", rev = "48fb8feecec54fdf52593744f780186fd7175f65", default-features = false, features = ["tiny-skia"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "std",
    "block2",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSView",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["std", "NSString", "NSGeometry", "objc2-core-foundation"] }
