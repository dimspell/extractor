[package]
name = "hexedit"
version = "0.8.0"
edition = "2021"

[[bin]]
name = "hexedit-bin"
path = "src/main.rs"

[[bin]]
name = "hexedit"
path = "src/bin/hexedit.rs"

[dependencies]
iced = { workspace = true, default-features = false, features = ["advanced", "thread-pool", "wgpu", "canvas", "lazy"] }
gui-widgets = { path = "../gui-widgets" }
lru = "0.12"
tokio = { version = "1", features = ["fs"] }
once_cell = "1"
rfd = "0.16"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[features]
default = ["lua"]
lua = ["dep:mlua"]

[dependencies.mlua]
version = "0.11.6"
optional = true
default-features = false
features = ["lua54", "send", "vendored"]

[dev-dependencies]
iced_test = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "std",
    "block2",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSView",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["std", "NSString", "NSGeometry", "objc2-core-foundation"] }
