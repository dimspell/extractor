[package]
name = "dispel-gui-win32"
version = "0.8.0"
edition = "2021"

[dependencies]
dispel_core = { package = "dispel-extractor", path = ".." }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
]}

[lib]
path = "src/lib.rs"

[[bin]]
name = "dispel-gui-win32"
path = "src/main.rs"

[features]
default = []
