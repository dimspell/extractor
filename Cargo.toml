[workspace]
members = [".", "dispel-encodings", "dispel-gui", "dispel-macros", "gui-widgets", "hexedit"]
resolver = "2"

# SINGLE PIN SET for the forked iced library. Every iced-family dependency in
# this workspace (including hexedit's `iced_renderer` dev-dep) must use the
# exact same `dimspell/iced` rev. Feature matrix, test-backend details and the
# consistency check are documented in docs/iced-fork-config.md; enforced by
# scripts/check-iced-config.sh. Do not introduce a second rev.
[workspace.dependencies]
iced = { git = "https://github.com/dimspell/iced", default-features = false, rev = "c0ffdd8e7352df9283496f3db334731c00ef6d0d" }
iced_test = { git = "https://github.com/dimspell/iced", rev = "c0ffdd8e7352df9283496f3db334731c00ef6d0d" }

[workspace.metadata]
features = ["iced_test"]

# winit is pinned to the iced-rs fork for version alignment with the iced fork.
[patch.crates-io]
winit = { git = "https://github.com/iced-rs/winit.git", rev = "05b8ff17a06562f0a10bb46e6eaacbe2a95cb5ed" }

[lib]
name = "dispel_core"
path = "src/lib.rs"

[package]
name = "dispel-extractor"
version = "0.9.4"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byteorder = "1.5.0"
image = "0.24.7"
encoding_rs = "0.8.33"
encoding_rs_io = "0.1.7"
clap = { version = "4.4.10", features = ["derive"] }
serde_json = { version = "1.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
dispel-macros = { path = "dispel-macros" }
dispel-encodings = { path = "dispel-encodings" }
csv = "1.3"
qbsdiff = "1.4"
uuid = { version = "1", features = ["v4", "serde"] }
zip = "8"
thiserror = "2"

[dependencies.rusqlite]
version = "0.39.0"
features = ["bundled"]

[profile.dev.package.cosmic-text]
overflow-checks = false

[dev-dependencies]
proptest = "1.4"
