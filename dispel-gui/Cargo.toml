[package]
name = "dispel-gui"
version = "0.8.0"
edition = "2021"

[dependencies]
iced = { workspace = true, default-features = false, features = ["tokio", "wgpu", "image", "canvas", "advanced", "lazy", "x11", "wayland", "accessibility"] }
accesskit = { path = "../../iced/vendor/accesskit" }
image = { version = "0.25", features = ["png", "jpeg"] }
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "fs", "sync", "time"] }
rfd = "0.16"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "6.0.0"
dispel_core = { package = "dispel-extractor", path = ".." }
nucleo-matcher = "0.3"
bincode = "1.3.3"
thiserror = "2.0.18"
iced_test = { workspace = true, optional = true }
env_logger = "0.10.0"
rodio = { version = "0.22", default-features = false, features = ["wav", "playback"] }
log = "0.4"
zip = "8"
lru = "0.12"
gui-widgets = { path = "../gui-widgets" }
hexedit = { path = "../hexedit" }
uuid = { version = "1", features = ["v4", "serde"] }
paste = "1.0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "std",
    "block2",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSView",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["std", "NSString", "NSGeometry", "objc2-core-foundation"] }

[features]
default = []
iced_test = ["dep:iced_test"]
tokio = []

[dependencies.rusqlite]
version = "0.39.0"
features = ["bundled"]

[dev-dependencies]
proptest = "1.4"
syn = { version = "2", features = ["full"] }
tempfile = "3.10.0"
