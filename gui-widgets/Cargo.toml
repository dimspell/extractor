[package]
name = "gui-widgets"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["advanced", "thread-pool"] }
lru = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "std",
    "block2",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSView",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["std", "NSString", "NSGeometry", "objc2-core-foundation"] }
