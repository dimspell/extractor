[package]
name = "gui-widgets"
version = "0.9.2"
edition = "2024"

[features]
default = ["accessibility"]
# Enables screen-reader (VoiceOver) support for the table widget: pulls in
# iced's `accessibility` trait methods.
accessibility = ["iced/accessibility"]

[dependencies]
iced = { workspace = true, default-features = false, features = ["advanced", "thread-pool", "wgpu"] }
lru = "0.12"
lucide-icons = "1.23"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "std",
    "block2",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSView",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["std", "NSString", "NSGeometry", "objc2-core-foundation"] }
